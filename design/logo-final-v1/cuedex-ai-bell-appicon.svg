      <stop offset=".42" stop-color="#3D94FF" stop-opacity=".324"/>
      <stop offset="1" stop-color="#3D94FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottom-glow" x1="0" y1="1" x2="0" y2="0">
