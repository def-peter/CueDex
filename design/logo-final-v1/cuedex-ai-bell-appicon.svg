      <stop offset=".715" stop-color="#3D94FF" stop-opacity=".324"/>
      <stop offset="1" stop-color="#3D94FF" stop-opacity=".90"/>
    </radialGradient>
    <radialGradient id="top-right-glow" cx="0" cy="100%" r="100%">
